<title>iPhone Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ===== מעטפת הסימולטור ===== */
:root{
  --bg: #14161a;
  --bg-2: #1c1f26;
  --line: #2b303a;
  --text: #e6e9ef;
  --muted: #8b93a3;
  --accent: #6ea8fe;
  --toolbar-h: 52px;
}

*{ box-sizing: border-box; }

html, body{ height: 100%; }
body{
  margin: 0;
  background:
    radial-gradient(1200px 700px at 50% -10%, #232833 0%, transparent 70%),
    var(--bg);
  color: var(--text);
  font: 13px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
  overflow: hidden;
}

/* ---------- סרגל כלים ---------- */
.toolbar{
  height: var(--toolbar-h);
  display: flex; align-items: center; gap: 14px;
  padding: 0 14px;
  background: rgba(20,22,26,.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  position: relative; z-index: 10;
  overflow-x: auto; overflow-y: hidden;
}
.brand{ display:flex; align-items:center; gap:8px; font-weight:600; letter-spacing:.2px; }
.brand .dot{
  width:9px; height:9px; border-radius:50%;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent);
}
.group{ display:flex; align-items:center; gap:8px; }
.group.grow{ flex:1; min-width:160px; }

.ctl{ display:flex; align-items:center; gap:6px; color: var(--muted); white-space: nowrap; }
.ctl.toggle{ cursor:pointer; user-select:none; }
.ctl input[type=checkbox]{ accent-color: var(--accent); }

select, .url{
  background: var(--bg-2);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 6px 8px;
  font: inherit;
  outline: none;
}
select:focus, .url:focus{ border-color: var(--accent); }
.url{ width:100%; direction: ltr; text-align: left; font-family: ui-monospace, Consolas, monospace; font-size:12px; }

.btn{
  background: var(--bg-2);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 6px 11px;
  font: inherit;
  cursor: pointer;
  white-space: nowrap;
  transition: background .12s, border-color .12s;
}
.btn:hover{ background:#252a33; border-color:#3a4150; }
.btn:active{ transform: translateY(1px); }
.btn.ghost{ background: transparent; }
.btn.on{ border-color: var(--accent); color: var(--accent); }

/* ---------- הבמה ---------- */
.stage{
  height: calc(100% - var(--toolbar-h));
  display: grid;
  place-items: center;
  position: relative;
  overflow: auto;
  padding: 24px;
}
.scaler{ transform-origin: center center; transition: transform .18s ease; }

.readout{
  position: absolute; bottom: 10px; inset-inline-start: 14px;
  color: var(--muted); font-family: ui-monospace, Consolas, monospace; font-size: 11px;
  direction: ltr; pointer-events: none;
}

/* ---------- גוף המכשיר ---------- */
.device{
  --w: 393px; --h: 852px; --bezel: 12px; --radius: 55px;
  position: relative;
  width: calc(var(--w) + var(--bezel) * 2);
  height: calc(var(--h) + var(--bezel) * 2 + var(--chin, 0px));
  padding: var(--bezel);
  padding-bottom: calc(var(--bezel) + var(--chin, 0px));
  border-radius: var(--radius);
  background: linear-gradient(155deg, #3a3f49 0%, #22252c 40%, #15171b 100%);
  box-shadow:
    0 0 0 2px #0c0e11,
    0 30px 70px -20px rgba(0,0,0,.85),
    inset 0 1px 1px rgba(255,255,255,.16);
  transition: width .2s, height .2s, border-radius .2s;
}

/* כפתורים פיזיים בצדדים */
.buttons i{
  position: absolute; background: #2a2e36; border-radius: 2px;
  box-shadow: inset 0 0 2px rgba(0,0,0,.6);
}
.buttons .btn-silent{ inset-inline-start:-2px; top: 105px; width:3px; height:26px; }
.buttons .btn-vol-up{ inset-inline-start:-2px; top: 150px; width:3px; height:52px; }
.buttons .btn-vol-dn{ inset-inline-start:-2px; top: 215px; width:3px; height:52px; }
.buttons .btn-power { inset-inline-end:-2px;   top: 175px; width:3px; height:78px; }
.device[data-orientation="landscape"] .buttons{ display:none; }

/* ---------- המסך ---------- */
.screen{
  position: relative;
  width: var(--w); height: var(--h);
  border-radius: calc(var(--radius) - var(--bezel) + 2px);
  overflow: hidden;
  background: #fff;
  isolation: isolate;
}
.screen iframe{
  width: 100%; height: 100%;
  border: 0; display: block;
  background: transparent;
}

/* שכבות ה-UI של מערכת ההפעלה */
.chrome{ position:absolute; inset:0; pointer-events:none; z-index: 2; }

/* מגרעת / נאטש / חור */
.cutout{ position:absolute; top:0; left:50%; transform:translateX(-50%); background:#000; }
.device[data-notch="island"] .cutout{ top:11px; width:125px; height:36px; border-radius:20px; }
.device[data-notch="notch"]  .cutout{ width:160px; height:30px; border-radius:0 0 18px 18px; }
.device[data-notch="hole"]   .cutout{
  top:10px; left:auto; right:14px; transform:none;
  width:11px; height:11px; border-radius:50%;
  box-shadow: 0 0 0 2px rgba(0,0,0,.35);
}
.device[data-notch="none"] .cutout{ display:none; }
.device[data-orientation="landscape"] .cutout{ display:none; }

/* שורת סטטוס */
.statusbar{
  position:absolute; top:0; left:0; right:0;
  height: var(--sb-h, 44px);
  display:flex; align-items:center; justify-content:space-between;
  direction: ltr;
  padding: 0 22px;
  font: 600 13px/1 -apple-system, "Segoe UI", system-ui, sans-serif;
  color: var(--sb-fg, #000);
  letter-spacing: .1px;
}
.device[data-platform="android"] .statusbar{
  padding: 0 14px; font-size:12px; font-weight:500; height: var(--sb-h, 30px);
}
.device[data-platform="android"] .sb-time{ order:-1; }
.sb-icons{ display:flex; align-items:center; gap:5px; }
.sb-icons svg{ display:block; }

/* פס הבית / ניווט */
.indicator{ position:absolute; bottom:0; left:0; right:0; display:flex; justify-content:center; align-items:center; }
.device[data-indicator="ios"] .indicator{ height:34px; }
.device[data-indicator="ios"] .indicator::after{
  content:""; width:140px; height:5px; border-radius:3px;
  background: var(--sb-fg, #000); opacity:.85;
}
.device[data-indicator="android"] .indicator{ height:24px; }
.device[data-indicator="android"] .indicator::after{
  content:""; width:108px; height:4px; border-radius:2px;
  background: var(--sb-fg, #000); opacity:.7;
}
.device[data-indicator="none"] .indicator{ display:none; }

/* כפתור בית פיזי (iPhone SE) */
.homebutton{ display:none; }
.device[data-home="true"] .homebutton{
  display:block;
  position:absolute; bottom: 12px; left:50%; transform:translateX(-50%);
  width:42px; height:42px; border-radius:50%;
  background: #1b1e24;
  box-shadow: inset 0 0 0 1.5px #3a4049, 0 1px 2px rgba(0,0,0,.5);
}

.ctl.toggle.on{ color: var(--accent); }

/* ===========================================================
   bundle.css — only loaded by the single-file build.
   Refines the studio chrome and makes the shell layout robust
   at any window size. The phone itself is untouched.

   Deliberately single-theme: a device stage is dark so the phone
   screen reads as the light source in the room. Every colour is
   painted explicitly, so the page holds on any host background.
   =========================================================== */

:root{
  color-scheme: dark;
  --bg:     #0d0f13;   /* near-black, biased slightly blue */
  --bg-2:   #171a20;
  --line:   #272c35;
  --text:   #e6e9f0;
  --muted:  #828b9c;
  --accent: #6ea8fe;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}

body{
  background:
    radial-gradient(1100px 620px at 50% -12%, #1e232c 0%, transparent 70%),
    var(--bg);
  display: flex;
  flex-direction: column;
  height: 100%;
}

/* the toolbar sizes itself and the stage takes the rest —
   more robust than a fixed height the stage subtracts */
.toolbar{
  flex: none;
  height: auto;
  min-height: 52px;
  flex-wrap: wrap;
  row-gap: 8px;
  padding: 9px 16px;
  overflow: visible;
  background: rgba(13,15,19,.9);
}
.stage{
  flex: 1 1 auto;
  min-height: 0;
  height: auto;
}

.brand{
  font-family: var(--mono);
  font-weight: 500;
  font-size: 12.5px;
  letter-spacing: -.2px;
}

.hint{
  margin: 0;
  margin-inline-start: auto;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
}
@media (max-width: 720px){ .hint{ display: none; } }

.readout{
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: -.1px;
}

/* visible keyboard focus — the toolbar is fully operable without a mouse */
.btn:focus-visible,
select:focus-visible,
.ctl.toggle:focus-within{
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce){
  .scaler{ transition: none; }
  .device{ transition: none; }
}

</style>

<header class="toolbar">
  <div class="brand"><span class="dot"></span><span>iPhone Simulator</span></div>

  <div class="group">
    <label class="ctl"><span>מכשיר</span><select id="device"></select></label>
    <label class="ctl"><span>זום</span>
      <select id="zoom">
        <option value="fit">התאם</option>
        <option value="1">100%</option>
        <option value="0.85">85%</option>
        <option value="0.75">75%</option>
        <option value="0.6">60%</option>
        <option value="0.5">50%</option>
      </select>
    </label>
  </div>

  <div class="group">
    <button id="rotate" class="btn" title="סיבוב (Ctrl+←/→)">⟳ סיבוב</button>
    <button id="theme" class="btn" title="מצב כהה/בהיר">◐ ערכה</button>
    <button id="reload" class="btn" title="רענון (R)">↻ רענון</button>
  </div>

  <p class="hint">גרור עם העכבר כדי לגלול · לחץ על אייקון כדי לפתוח אפליקציה</p>
</header>

<main class="stage" id="stage">
  <div class="scaler" id="scaler">
    <div class="device" id="deviceEl">
      <div class="buttons">
        <i class="btn-silent"></i><i class="btn-vol-up"></i>
        <i class="btn-vol-dn"></i><i class="btn-power"></i>
      </div>
      <div class="screen" id="screen">
        <iframe id="frame" title="iPhone screen" allow="microphone"></iframe>
        <div class="chrome" id="chrome">
          <div class="cutout" id="cutout"></div>
          <div class="statusbar" id="statusbar">
            <span class="sb-time" id="clock">9:41</span>
            <span class="sb-icons" id="sbIcons"></span>
          </div>
          <div class="indicator" id="indicator"></div>
        </div>
      </div>
      <div class="homebutton" id="homebutton"></div>
    </div>
  </div>
  <div class="readout" id="readout"></div>
</main>

    device: $('device'), zoom: $('zoom'), rotate: $('rotate'), theme: $('theme'),
    reload: $('reload'),
    stage: $('stage'), scaler: $('scaler'), deviceEl: $('deviceEl'), screen: $('screen'),
    frame: $('frame'), clock: $('clock'), sbIcons: $('sbIcons'), readout: $('readout'),
  };

  const STORE = 'walle.sim.state';
  const state = Object.assign({
    deviceId: 'iphone-15-pro',
    orientation: 'portrait',
    zoom: 'fit',
    theme: 'light',
    live: false,
    url: 'app/index.html',
  }, load());

  // ?url=... ו-?device=... דורסים את המצב השמור – נוח לקישור ישיר למסך מסוים
  const q = new URLSearchParams(location.search);
  if (q.get('url'))    state.url = q.get('url');
  if (q.get('device')) state.deviceId = q.get('device');

  const scrollMemory = new Map();
  let sbStyle = null;   // סגנון שורת הסטטוס שהאפליקציה ביקשה: 'light' | 'dark'

  function load() {
    try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; }
  }
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
  }

  const device = () => DEVICES.find(d => d.id === state.deviceId) || DEVICES[0];

  /* ---------- אתחול פקדים ---------- */
  DEVICES.forEach(d => {
    const o = document.createElement('option');
    o.value = d.id;
    o.textContent = d.name + '  ·  ' + d.width + '×' + d.height;
    el.device.appendChild(o);
  });

  el.device.value = state.deviceId;
  el.zoom.value = state.zoom;

  /* ---------- ציור המכשיר ---------- */
  function render() {
    const d = device();
    const land = state.orientation === 'landscape';
    const w = land ? d.height : d.width;
    const h = land ? d.width : d.height;

    const dev = el.deviceEl;
    dev.style.setProperty('--w', w + 'px');
    dev.style.setProperty('--h', h + 'px');
    dev.style.setProperty('--bezel', d.bezel + 'px');
    dev.style.setProperty('--radius', d.radius + 'px');
    dev.style.setProperty('--chin', (d.chin || 0) + 'px');

    dev.dataset.platform    = d.platform;
    dev.dataset.notch       = land ? 'none' : d.notch;
    dev.dataset.orientation = state.orientation;
    dev.dataset.home        = String(!!d.chin);
    dev.dataset.indicator   = d.homeIndicator ? d.platform : 'none';

    // אזורים בטוחים – משתנים לפי כיוון המכשיר
    const safe = land
      ? { top: d.platform === 'ios' ? 0 : 24,
          bottom: d.homeIndicator ? 21 : 0,
          left:  d.notch !== 'none' ? 44 : 0,
          right: d.notch !== 'none' ? 44 : 0 }
      : { top: d.safe.top, bottom: d.safe.bottom, left: 0, right: 0 };

    const sbH = land ? 24 : d.safe.top;
    dev.style.setProperty('--sb-h', sbH + 'px');
    const fg = sbStyle ? (sbStyle === 'light' ? '#fff' : '#000')
                       : (state.theme === 'dark' ? '#fff' : '#000');
    dev.style.setProperty('--sb-fg', fg);
    el.screen.style.background = state.theme === 'dark' ? '#000' : '#fff';

    drawStatusIcons(d.platform);
    applyZoom(w, h, d);

    el.readout.textContent =
      d.name + ' · ' + w + '×' + h + ' · ' + state.orientation +
      ' · ' + state.theme + ' · safe(' + safe.top + '/' + safe.bottom + ')';

    postConfig(d, w, h, safe);
    save();
  }

  /* ---------- זום ---------- */
  function applyZoom(w, h, d) {
    const fullW = w + d.bezel * 2;
    const fullH = h + d.bezel * 2 + (d.chin || 0);
    let s;
    if (state.zoom === 'fit') {
      const pad = 48;
      s = Math.min(1,
        (el.stage.clientHeight - pad) / fullH,
        (el.stage.clientWidth  - pad) / fullW);
    } else {
      s = parseFloat(state.zoom);
    }
    s = Math.max(0.2, s);
    el.scaler.style.transform = 'scale(' + s + ')';
    el.scaler.style.margin =
      ((fullH * s - fullH) / 2) + 'px ' + ((fullW * s - fullW) / 2) + 'px';
  }

  /* ---------- אייקוני שורת הסטטוס ---------- */
  function drawStatusIcons(platform) {
    const cellular = '<svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor">' +
      '<rect x="0" y="7" width="3" height="4" rx="1"/>' +
      '<rect x="4.6" y="5" width="3" height="6" rx="1"/>' +
      '<rect x="9.2" y="2.5" width="3" height="8.5" rx="1"/>' +
      '<rect x="13.8" y="0" width="3" height="11" rx="1"/></svg>';
    const wifi = '<svg width="16" height="11" viewBox="0 0 16 12" fill="currentColor">' +
      '<path d="M8 11.2 5.6 8.6a3.4 3.4 0 0 1 4.8 0L8 11.2Z"/>' +
      '<path d="M3.6 6.5 2.1 5A8.4 8.4 0 0 1 13.9 5l-1.5 1.5a6.3 6.3 0 0 0-8.8 0Z"/>' +
      '<path d="M5.6 8.5 4.2 7.1a5.4 5.4 0 0 1 7.6 0l-1.4 1.4a3.4 3.4 0 0 0-4.8 0Z"/></svg>';
    const battery = '<svg width="25" height="12" viewBox="0 0 25 12">' +
      '<rect x=".5" y=".5" width="21" height="11" rx="3.2" fill="none" stroke="currentColor" opacity=".38"/>' +
      '<rect x="2.2" y="2.2" width="15" height="7.6" rx="1.8" fill="currentColor"/>' +
      '<path d="M23 4.2v3.6c1.1-.4 1.1-3.2 0-3.6Z" fill="currentColor" opacity=".45"/></svg>';
    el.sbIcons.innerHTML = platform === 'ios'
      ? cellular + wifi + battery
      : wifi + cellular + battery;
  }

  /* ---------- שעון ---------- */
  function tick() {
    const n = new Date();
    el.clock.textContent = n.getHours() + ':' + String(n.getMinutes()).padStart(2, '0');
  }
  tick();
  setInterval(tick, 10000);

  /* ---------- גשר אל האפליקציה שבתוך המסגרת ---------- */
  function postConfig(d, w, h, safe) {
    const msg = {
      type: 'sim:config',
      platform: d.platform,
      deviceName: d.name,
      theme: state.theme,
      orientation: state.orientation,
      width: w, height: h,
      safe: safe,
      restoreScroll: scrollMemory.get(el.frame.src) || 0,
    };
    try { el.frame.contentWindow.postMessage(msg, '*'); } catch (e) {}
  }

  window.addEventListener('message', (e) => {
    const m = e.data;
    if (!m || typeof m !== 'object') return;
    if (m.type === 'sim:ready')  render();
    if (m.type === 'sim:statusbar') { sbStyle = m.style; render(); }
    if (m.type === 'sim:scroll') scrollMemory.set(el.frame.src, m.y || 0);
  });

  el.frame.addEventListener('load', () => { sbStyle = null; setTimeout(render, 0); });

  /* ---------- אירועים ---------- */
  el.device.addEventListener('change', () => { state.deviceId = el.device.value; render(); });
  el.zoom.addEventListener('change',   () => { state.zoom = el.zoom.value; render(); });

  el.rotate.addEventListener('click', () => {
    state.orientation = state.orientation === 'portrait' ? 'landscape' : 'portrait';
    render();
  });

  el.theme.addEventListener('click', () => {
    state.theme = state.theme === 'light' ? 'dark' : 'light';
    el.theme.classList.toggle('on', state.theme === 'dark');
    render();
  });

  // ב-file:// המסגרת נחשבת ממקור שונה, לכן יש נפילה חזרה לגשר שבתוך האפליקציה
  function reload() {
    try { el.frame.contentWindow.location.reload(); }
    catch (e) { el.frame.contentWindow.postMessage({ type: 'sim:reload' }, '*'); }
  }
  el.reload.addEventListener('click', reload);


  /* single-file build: the app is embedded, there is nothing to load */

  window.addEventListener('resize', () => { if (state.zoom === 'fit') render(); });

  document.addEventListener('keydown', (e) => {
    const t = e.target.tagName;
    if (t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA') return;
    if (e.key === 'r' || e.key === 'R') reload();
    if ((e.ctrlKey || e.metaKey) && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
      e.preventDefault();
      el.rotate.click();
    }
  });

  /* ---------- הפעלה ---------- */
  el.theme.classList.toggle('on', state.theme === 'dark');
  el.frame.srcdoc = (function () {
    var raw = atob(document.getElementById('appdoc').textContent.trim());
    var bytes = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  })();
  render();
})();

</script>
